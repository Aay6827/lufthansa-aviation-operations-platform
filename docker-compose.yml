services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aviation_ops
      POSTGRES_USER: aviation_app
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviation_app -d aviation_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aviation_app:local_dev_only_change_me@db:5432/aviation_ops
      ENVIRONMENT: development
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
